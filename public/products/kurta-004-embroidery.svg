<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="detailBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF8" />
      <stop offset="100%" stop-color="#EEE6DD" />
    </linearGradient>
    <linearGradient id="deepMaroonSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1420" />
      <stop offset="50%" stop-color="#3B0C16" />
      <stop offset="100%" stop-color="#2A0810" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#detailBg4)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#D8CCC0" stroke-width="1"/>

  <!-- Macro Silk Texture with Gold Zari Motif -->
  <rect x="100" y="120" width="600" height="650" rx="4" fill="url(#deepMaroonSilk)"/>

  <!-- Dramatic Gold Embroidery Yoke Centerpiece -->
  <g transform="translate(400, 420)">
    <!-- Outer ornate medallion -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#D4AF37" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="80" fill="#4A1420" stroke="#E6CA65" stroke-width="2"/>

    <!-- Central Lotus / Paisley Elements -->
    <path d="M 0 -60 C 30 -30 30 30 0 60 C -30 30 -30 -30 0 -60 Z" fill="#D4AF37" opacity="0.9"/>
    <path d="M -60 0 C -30 30 30 30 60 0 C 30 -30 -30 -30 -60 0 Z" fill="#D4AF37" opacity="0.9"/>
    <circle cx="0" cy="0" r="14" fill="#FAF8F5" stroke="#D4AF37" stroke-width="3"/>

    <!-- Radial petals -->
    <circle cx="0" cy="-110" r="8" fill="#E6CA65"/>
    <circle cx="0" cy="110" r="8" fill="#E6CA65"/>
    <circle cx="-110" cy="0" r="8" fill="#E6CA65"/>
    <circle cx="110" cy="0" r="8" fill="#E6CA65"/>
    <circle cx="-78" cy="-78" r="6" fill="#D4AF37"/>
    <circle cx="78" cy="-78" r="6" fill="#D4AF37"/>
    <circle cx="-78" cy="78" r="6" fill="#D4AF37"/>
    <circle cx="78" cy="78" r="6" fill="#D4AF37"/>
  </g>

  <g transform="translate(400, 850)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="4" fill="#6B6258">ZARI EMBROIDERY DETAIL</text>
    <text font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#1C1917" y="30">High-Lustre Festive Silk Blend</text>
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#842337" y="52">Fine Gold Needlework · Rich Color Depth · Special Occasion</text>
  </g>
</svg>
