<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="detailBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F2" />
      <stop offset="100%" stop-color="#EDE6DE" />
    </linearGradient>
    <pattern id="macroAjrakh" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#FAF7F2"/>
      <path d="M 40 0 L 80 40 L 40 80 L 0 40 Z" fill="#24343D" opacity="0.15"/>
      <circle cx="40" cy="40" r="16" fill="#8B3A2B" opacity="0.85"/>
      <circle cx="40" cy="40" r="8" fill="#C59B27"/>
      <circle cx="40" cy="40" r="3" fill="#24343D"/>
      <path d="M 0 0 L 80 80 M 80 0 L 0 80" stroke="#C59B27" stroke-width="1.5" opacity="0.6"/>
      <circle cx="0" cy="40" r="6" fill="#8B3A2B"/>
      <circle cx="80" cy="40" r="6" fill="#8B3A2B"/>
      <circle cx="40" cy="0" r="6" fill="#8B3A2B"/>
      <circle cx="40" cy="80" r="6" fill="#8B3A2B"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#detailBg)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#D8CCC0" stroke-width="1"/>

  <!-- Macro Textile Swatch -->
  <rect x="100" y="120" width="600" height="650" rx="4" fill="url(#macroAjrakh)"/>
  
  <!-- Diagonal Angrakha Border Fold with Piping & Dori -->
  <path d="M 100 200 L 700 650" stroke="#8B3A2B" stroke-width="36" stroke-linecap="square"/>
  <path d="M 100 200 L 700 650" stroke="#C59B27" stroke-width="8" stroke-dasharray="12 8"/>
  <path d="M 100 200 L 700 650" stroke="#FAF8F5" stroke-width="2"/>

  <!-- Intricate Handcrafted Tassel -->
  <g transform="translate(420, 480)">
    <path d="M 0 0 Q 30 50 10 110" fill="none" stroke="#C59B27" stroke-width="3"/>
    <circle cx="10" cy="115" r="9" fill="#8B3A2B" stroke="#C59B27" stroke-width="2"/>
    <!-- Threads -->
    <path d="M 5 124 L 0 160 M 10 124 L 10 165 M 15 124 L 20 160" stroke="#C59B27" stroke-width="2"/>
  </g>

  <g transform="translate(400, 850)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="4" fill="#6B6258">DETAIL FOCUS</text>
    <text font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#1C1917" y="30">Traditional Ajrakh Hand-Block Craft</text>
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8B3A2B" y="52">Authentic Indigo & Madder Motifs with Surplice Tie-Up</text>
  </g>
</svg>
