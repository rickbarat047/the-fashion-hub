<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F5" />
      <stop offset="100%" stop-color="#EBE3DA" />
    </linearGradient>
    <linearGradient id="maroonSilkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C28" />
      <stop offset="35%" stop-color="#4C1622" />
      <stop offset="70%" stop-color="#672132" />
      <stop offset="100%" stop-color="#3D101A" />
    </linearGradient>
    <filter id="softShadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1C1917" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#bgGrad4)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#D8CCC0" stroke-width="1"/>
  <rect x="48" y="48" width="704" height="904" fill="none" stroke="#EAE2D8" stroke-width="0.5"/>

  <!-- Garment Silhouette -->
  <g filter="url(#softShadow4)" transform="translate(100, 110)">
    <!-- Three-Quarter Sleeves -->
    <path d="M 210 60 L 110 220 L 150 250 L 230 140 Z" fill="#4C1622"/>
    <path d="M 390 60 L 490 220 L 450 250 L 370 140 Z" fill="#4C1622"/>
    <!-- Sleeve Cuff Gold Zari Border -->
    <line x1="110" y1="220" x2="150" y2="250" stroke="#D4AF37" stroke-width="5"/>
    <line x1="490" y1="220" x2="450" y2="250" stroke="#D4AF37" stroke-width="5"/>

    <!-- A-Line Silk Kurta Body -->
    <path d="M 210 60 
             Q 300 45 390 60 
             L 370 170 
             L 480 690 
             Q 300 720 120 690 
             L 230 170 Z" 
          fill="url(#maroonSilkGrad)" stroke="#3D101A" stroke-width="1.5"/>

    <!-- Round Neckline with Gold Resham Border -->
    <path d="M 260 55 Q 300 110 340 55" fill="none" stroke="#D4AF37" stroke-width="4"/>

    <!-- Intricate Floral Embroidery Yoke on Yoke/Chest Area -->
    <g transform="translate(300, 150)">
      <!-- Central Paisley / Floral Motif -->
      <path d="M 0 -20 C 20 -40 40 0 0 40 C -40 0 -20 -40 0 -20 Z" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
      <circle cx="0" cy="10" r="5" fill="#E6CA65"/>
      <!-- Symmetrical vines -->
      <path d="M 0 10 Q -40 20 -50 60 Q -30 70 -10 50" fill="none" stroke="#D4AF37" stroke-width="2"/>
      <path d="M 0 10 Q 40 20 50 60 Q 30 70 10 50" fill="none" stroke="#D4AF37" stroke-width="2"/>
      <circle cx="-50" cy="60" r="3" fill="#E6CA65"/>
      <circle cx="50" cy="60" r="3" fill="#E6CA65"/>
      <circle cx="-30" cy="40" r="2.5" fill="#D4AF37"/>
      <circle cx="30" cy="40" r="2.5" fill="#D4AF37"/>

      <!-- Lower Placket Border -->
      <line x1="0" y1="70" x2="0" y2="180" stroke="#D4AF37" stroke-width="3"/>
      <circle cx="0" cy="100" r="4" fill="#D4AF37"/>
      <circle cx="0" cy="130" r="4" fill="#D4AF37"/>
      <circle cx="0" cy="160" r="4" fill="#D4AF37"/>
    </g>

    <!-- Silk Lustre Sheen Highlight -->
    <path d="M 280 200 Q 250 450 200 690" stroke="#7A2D3F" stroke-width="3" opacity="0.6" fill="none"/>
    <path d="M 320 200 Q 350 450 400 690" stroke="#7A2D3F" stroke-width="3" opacity="0.6" fill="none"/>
  </g>

  <!-- Editorial Metadata Plate -->
  <g transform="translate(400, 870)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="4" fill="#6B6258">FESTIVE EDIT · EMBROIDERED</text>
    <text font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#1C1917" y="30">Lustrous Silk Kurta</text>
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#842337" y="52">Royal Maroon Silk Blend · Gold Floral Embroidery · A-Line Cut</text>
  </g>
</svg>
