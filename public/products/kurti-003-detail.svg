<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="detailBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF8" />
      <stop offset="100%" stop-color="#EFE8DE" />
    </linearGradient>
    <pattern id="macroFloral" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#FFFDF9"/>
      <!-- Detailed Floral Bunch -->
      <circle cx="50" cy="50" r="10" fill="#C2410C" opacity="0.9"/>
      <circle cx="50" cy="35" r="9" fill="#BE185D" opacity="0.75"/>
      <circle cx="50" cy="65" r="9" fill="#BE185D" opacity="0.75"/>
      <circle cx="35" cy="50" r="9" fill="#DB2777" opacity="0.75"/>
      <circle cx="65" cy="50" r="9" fill="#DB2777" opacity="0.75"/>
      <!-- Soft Vine -->
      <path d="M 20 20 Q 35 15 50 25 T 80 20" stroke="#047857" stroke-width="2.5" fill="none"/>
      <path d="M 80 80 Q 65 85 50 75 T 20 80" stroke="#047857" stroke-width="2.5" fill="none"/>
      <circle cx="28" cy="22" r="4" fill="#059669"/>
      <circle cx="72" cy="78" r="4" fill="#059669"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#detailBg3)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#D8CCC0" stroke-width="1"/>

  <!-- Macro Swatch -->
  <rect x="100" y="120" width="600" height="650" rx="4" fill="url(#macroFloral)"/>
  
  <!-- Notch Collar Mockup -->
  <path d="M 250 120 L 400 340 L 550 120" stroke="#BE185D" stroke-width="12" fill="none"/>
  <path d="M 400 340 L 400 680" stroke="#BE185D" stroke-width="8"/>
  <circle cx="400" cy="420" r="12" fill="#C2410C" stroke="#FFF" stroke-width="2"/>
  <circle cx="400" cy="500" r="12" fill="#C2410C" stroke="#FFF" stroke-width="2"/>
  <circle cx="400" cy="580" r="12" fill="#C2410C" stroke="#FFF" stroke-width="2"/>

  <g transform="translate(400, 850)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="4" fill="#6B6258">BOTANICAL PRINT CLOSE-UP</text>
    <text font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#1C1917" y="30">Everyday Breathable Fabric</text>
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#BE185D" y="52">Soft Handfeel · Colorfast Botanical Print with Notch Collar</text>
  </g>
</svg>
