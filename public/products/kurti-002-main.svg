<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F7" />
      <stop offset="100%" stop-color="#ECE5DE" />
    </linearGradient>
    <linearGradient id="redSilkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B22222" />
      <stop offset="40%" stop-color="#991B1B" />
      <stop offset="80%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#5B1010" />
    </linearGradient>
    <filter id="softShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1C1917" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#bgGrad2)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#D8CCC0" stroke-width="1"/>
  <rect x="48" y="48" width="704" height="904" fill="none" stroke="#EAE2D8" stroke-width="0.5"/>

  <!-- Garment Silhouette -->
  <g filter="url(#softShadow2)" transform="translate(100, 110)">
    <!-- Long Sleeves Left & Right -->
    <!-- Left Sleeve -->
    <path d="M 210 60 L 90 280 L 130 310 L 230 140 Z" fill="#8B1818"/>
    <!-- Right Sleeve -->
    <path d="M 390 60 L 510 280 L 470 310 L 370 140 Z" fill="#8B1818"/>

    <!-- A-line Kurti Body in Crimson Red -->
    <path d="M 210 60 
             Q 300 45 390 60 
             L 370 180 
             L 490 690 
             Q 300 720 110 690 
             L 230 180 Z" 
          fill="url(#redSilkGrad)" stroke="#7F1D1D" stroke-width="1.5"/>

    <!-- Fabric Drape Folds -->
    <path d="M 300 120 Q 280 400 230 695" fill="none" stroke="#5B1010" stroke-width="2" opacity="0.4"/>
    <path d="M 300 120 Q 320 400 370 700" fill="none" stroke="#5B1010" stroke-width="2" opacity="0.4"/>
    <path d="M 300 120 Q 300 450 300 708" fill="none" stroke="#B91C1C" stroke-width="1.5" opacity="0.5"/>

    <!-- Refined Round Neckline with Gold Accent Piping -->
    <path d="M 260 55 Q 300 110 340 55" fill="none" stroke="#C59B27" stroke-width="3"/>
    <path d="M 260 55 Q 300 110 340 55" fill="none" stroke="#FAF8F5" stroke-width="1"/>
    
    <!-- Delicate Center Button Placket -->
    <path d="M 300 110 L 300 260" stroke="#C59B27" stroke-width="2"/>
    <circle cx="300" cy="140" r="3.5" fill="#C59B27"/>
    <circle cx="300" cy="170" r="3.5" fill="#C59B27"/>
    <circle cx="300" cy="200" r="3.5" fill="#C59B27"/>
    <circle cx="300" cy="230" r="3.5" fill="#C59B27"/>

    <!-- Side Slits Indication -->
    <path d="M 170 420 L 120 690" stroke="#5B1010" stroke-width="2" opacity="0.6"/>
    <path d="M 430 420 L 480 690" stroke="#5B1010" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Editorial Metadata Plate -->
  <g transform="translate(400, 870)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="4" fill="#6B6258">REFINED SOLID · PARTY EDIT</text>
    <text font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#1C1917" y="30">Chitrarekha A-Line Kurti</text>
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#991B1B" y="52">Rich Crimson · Long Sleeves · Round Neck · Calf Length</text>
  </g>
</svg>
